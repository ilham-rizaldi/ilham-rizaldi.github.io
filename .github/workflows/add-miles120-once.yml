name: Add Miles120 runner collaboration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-miles120-once.yml']
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add the runner link without changing existing content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import base64, json, os, re, time
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          repo = os.environ['REPOSITORY']
          assert repo == 'ilham-rizaldi/ilham-rizaldi.github.io'
          api_root = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Portfolio-targeted-update'}
          def api(path, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = Request(api_root + path, data=body, headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)
          meta = api('/contents/index.html?ref=main')
          blob = api('/git/blobs/' + meta['sha'])
          original = base64.b64decode(blob['content']).decode('utf-8')
          link = 'https://www.instagram.com/miles120_/'
          line_offsets = [0]
          for line in original.splitlines(keepends=True):
              line_offsets.append(line_offsets[-1] + len(line))
          class Groups(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.stack = []
                  self.groups = []
              def absolute_position(self):
                  line, column = self.getpos()
                  return line_offsets[line-1] + column
              def handle_starttag(self, tag, attrs):
                  if tag == 'div':
                      self.stack.append({'start': self.absolute_position(), 'class': dict(attrs).get('class', '')})
              def handle_startendtag(self, tag, attrs):
                  pass
              def handle_endtag(self, tag):
                  if tag == 'div' and self.stack:
                      node = self.stack.pop()
                      node['close'] = self.absolute_position()
                      if 'kol-group' in node['class'].split():
                          self.groups.append(node)
          parser = Groups()
          parser.feed(original)
          matches = [g for g in parser.groups if 'Runner collaboration' in original[g['start']:g['close']]]
          assert len(matches) == 1, 'Expected exactly one Runner collaboration group; no edit made.'
          group = matches[0]
          existing = original[group['start']:group['close']]
          assert 'Rameshiano' in existing and 'Okin' in existing, 'Expected Okin entry; no edit made.'
          print('EXISTING_GROUP=' + re.sub(r'data:image/[^\"\s]+', '[embedded image]', existing))
          for style in re.findall(r'[^{}]*kol-(?:item|avatar|name|note)[^{}]*\{[^}]*\}', original):
              print('STYLE=' + style[-1200:])
          addition = '''
          <a class="kol-item" id="runner-miles120" href="https://www.instagram.com/miles120_/" target="_blank" rel="noopener noreferrer">
            <span class="kol-avatar" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600">M120</span>
            <span><span class="kol-name" style="display:block">Miles120</span><span class="kol-note" style="display:block">@miles120_</span></span>
          </a>
          '''
          if link in existing:
              print('Miles120 is already present in Runner collaboration; no duplicate added.')
              updated = original
          else:
              assert link not in original, 'Profile already occurs elsewhere; inspect before duplicating.'
              updated = original[:group['close']] + addition + original[group['close']:]
              assert updated.replace(addition, '', 1) == original
              assert updated.count(link) == 1
              result = api('/contents/index.html', 'PUT', {'message': 'Add Miles120 to Runner collaboration alongside Okin', 'content': base64.b64encode(updated.encode('utf-8')).decode('ascii'), 'sha': meta['sha'], 'branch': 'main'})
              print('COMMIT=' + result['commit']['sha'])
              check = api('/git/blobs/' + result['content']['sha'])
              saved = base64.b64decode(check['content']).decode('utf-8')
              assert saved == updated, 'Saved content did not match the targeted update.'
              print('VERIFIED: only the Miles120 entry was inserted; all existing bytes preserved.')
          print('ENTRY=' + addition.strip())
          try:
              build = api('/pages/builds', 'POST', {})
              print('Pages build requested: ' + str(build.get('status', 'accepted')))
          except HTTPError as error:
              print('Pages build request returned HTTP ' + str(error.code) + '; repository change remains saved.')
          for attempt in range(24):
              try:
                  request = Request('https://ilham-rizaldi.github.io/?verify=miles120-' + str(int(time.time())), headers={'User-Agent': 'Portfolio-verification', 'Cache-Control': 'no-cache'})
                  with urlopen(request, timeout=15) as response:
                      live = response.read().decode('utf-8')
                  if 'id="runner-miles120"' in live and link in live:
                      assert 'Rameshiano' in live and '30-day charity run challenge' in live
                      print('LIVE_VERIFIED=https://ilham-rizaldi.github.io/#runner-miles120')
                      break
              except (HTTPError, URLError, TimeoutError) as error:
                  print('Live check: ' + type(error).__name__)
              time.sleep(5)
          else:
              print('LIVE_NOT_YET_VERIFIED: source update is saved; check Pages deployment.')
