name: Add Miles120 runner collaboration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-miles120-once.yml']
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add Miles120 to the existing runner list and verify publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: '1'
        shell: python
        run: |
          import base64, json, os, re, time
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          repo = os.environ['REPOSITORY']
          assert repo == 'ilham-rizaldi/ilham-rizaldi.github.io'
          api_root = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Portfolio-targeted-update'}
          def api(path, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = Request(api_root + path, data=body, headers=headers, method=method)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)
          meta = api('/contents/index.html?ref=main')
          blob = api('/git/blobs/' + meta['sha'])
          original = base64.b64decode(blob['content']).decode('utf-8')
          link = 'https://www.instagram.com/miles120_/'
          line_offsets = [0] + [m.end() for m in re.finditer('\n', original)]
          class Containers(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.stacks = {'div': [], 'article': []}
                  self.nodes = []
              def absolute_position(self):
                  line, column = self.getpos()
                  return line_offsets[line-1] + column
              def handle_starttag(self, tag, attrs):
                  if tag in self.stacks:
                      self.stacks[tag].append({'tag': tag, 'start': self.absolute_position(), 'classes': dict(attrs).get('class', '').split()})
              def handle_startendtag(self, tag, attrs):
                  pass
              def handle_endtag(self, tag):
                  if tag in self.stacks and self.stacks[tag]:
                      node = self.stacks[tag].pop()
                      node['close'] = self.absolute_position()
                      self.nodes.append(node)
          parser = Containers()
          parser.feed(original)
          groups = [g for g in parser.nodes if g['tag'] == 'article' and 'collab-group' in g['classes'] and '<h4>Runner collaboration</h4>' in original[g['start']:g['close']]]
          assert len(groups) == 1, 'Expected exactly one Runner collaboration article; no edit made.'
          group = groups[0]
          lists = [n for n in parser.nodes if n['tag'] == 'div' and 'collab-list' in n['classes'] and group['start'] < n['start'] < n['close'] < group['close']]
          assert len(lists) == 1, 'Expected one collaboration list inside the runner article; no edit made.'
          target = lists[0]
          existing = original[target['start']:target['close']]
          assert 'Rameshiano' in existing and 'Okin' in existing, 'Expected the existing Okin entry; no edit made.'
          assert 'class="collab-row"' in existing and 'collab-copy' in existing
          print('TARGET_VERIFIED=article.collab-group / Runner collaboration / div.collab-list')
          addition = '''
                  <a class="collab-row" id="runner-miles120" href="https://www.instagram.com/miles120_/" target="_blank" rel="noopener noreferrer"><span class="kol-avatar" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--soft);color:var(--ink);font-size:11px;font-weight:600">M120</span><span class="collab-copy"><span class="collab-name">Miles120</span><span class="collab-note">@miles120_</span></span></a>
                '''
          if link in existing:
              assert 'id="runner-miles120"' in existing
              print('ALREADY_PRESENT: no duplicate entry added.')
              updated = original
          else:
              assert link not in original, 'The profile already occurs elsewhere; inspect before duplicating.'
              updated = original[:target['close']] + addition + original[target['close']:]
              assert updated.replace(addition, '', 1) == original
              assert updated.count(link) == 1
              result = api('/contents/index.html', 'PUT', {'message': 'Add Miles120 to Runner collaboration alongside Okin', 'content': base64.b64encode(updated.encode('utf-8')).decode('ascii'), 'sha': meta['sha'], 'branch': 'main'})
              print('COMMIT=' + result['commit']['sha'])
              print('INDEX_BLOB=' + result['content']['sha'])
              check = api('/git/blobs/' + result['content']['sha'])
              assert base64.b64decode(check['content']).decode('utf-8') == updated, 'Saved content does not match.'
              print('SOURCE_VERIFIED: one entry added inside the existing runner list; every original byte preserved.')
          print('ENTRY=' + addition.strip())
          try:
              build = api('/pages/builds', 'POST', {})
              print('PAGES_BUILD=' + str(build.get('status', 'accepted')))
          except HTTPError as error:
              print('PAGES_BUILD_HTTP=' + str(error.code))
          for attempt in range(24):
              try:
                  request = Request('https://ilham-rizaldi.github.io/?verify=miles120-' + str(int(time.time())), headers={'User-Agent': 'Portfolio-verification', 'Cache-Control': 'no-cache'})
                  with urlopen(request, timeout=15) as response:
                      live = response.read().decode('utf-8')
                  if 'id="runner-miles120"' in live and link in live:
                      assert 'Rameshiano' in live and '30-day charity run challenge' in live
                      print('LIVE_VERIFIED=https://ilham-rizaldi.github.io/#runner-miles120')
                      break
              except (HTTPError, URLError, TimeoutError) as error:
                  print('LIVE_CHECK=' + type(error).__name__)
              time.sleep(5)
          else:
              print('LIVE_NOT_YET_VERIFIED: the source change is saved; inspect the Pages deployment.')
